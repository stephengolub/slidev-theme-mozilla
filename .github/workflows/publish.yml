name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      # No registry-url here: setup-node would write an .npmrc that sends a
      # placeholder NODE_AUTH_TOKEN, which blocks the OIDC token exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Check release tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v${pkg_version}" != "${RELEASE_TAG}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${pkg_version}" >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      # The trusted publisher only allows staged publishing, so this stages the
      # release. A maintainer runs `npm stage approve <stage-id>` to publish it.
      - run: npm stage publish --provenance --access public
