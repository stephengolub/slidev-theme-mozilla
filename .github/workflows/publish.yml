name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - name: Check release tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v${pkg_version}" != "${RELEASE_TAG}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${pkg_version}" >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - run: npm publish --provenance --access public
